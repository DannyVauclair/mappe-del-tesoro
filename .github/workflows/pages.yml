name: Deploy Wildlands Treasure Map

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build clean base map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets /tmp/rdr-map
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://media.githubusercontent.com/media/asd007/RDOCollectorMapOverlay/main/data/rdr2_map_hq.png" \
            -o /tmp/rdr-map/source.png
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageEnhance

          source = Path("/tmp/rdr-map/source.png")
          print("Downloaded source:", source.stat().st_size)

          img = Image.open(source).convert("RGB")
          print("Source dimensions:", img.size)
          img = img.resize((2048, 1590), Image.Resampling.LANCZOS)

          # Rebuild decorative corner areas from clean parchment while leaving
          # the actual world map untouched, so treasure coordinates stay aligned.
          parchment = img.crop((40, 330, 600, 900)).filter(ImageFilter.GaussianBlur(1.2))

          def parchment_fill(box):
              x0, y0, x1, y1 = box
              w, h = x1 - x0, y1 - y0
              patch = parchment.resize((w, h), Image.Resampling.LANCZOS)
              ring = img.crop((max(0, x0-18), max(0, y0-18),
                               min(img.width, x1+18), min(img.height, y1+18)))
              target = sum(ring.convert("L").getdata()) / max(1, ring.width*ring.height)
              current = sum(patch.convert("L").getdata()) / max(1, patch.width*patch.height)
              if current:
                  patch = ImageEnhance.Brightness(patch).enhance(target/current)
              img.paste(patch, (x0, y0))

          parchment_fill((0, 0, 650, 320))
          parchment_fill((1020, 1330, 1995, 1535))
          parchment_fill((1980, 1520, 2048, 1590))

          out = Path("assets/Mappa4K.webp")
          img.save(out, "WEBP", quality=88, method=6)
          print("Generated:", out, out.stat().st_size)
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
